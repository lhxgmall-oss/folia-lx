# Folia-LX: builds the Windows installer (NSIS) when a version tag is pushed, and attaches it to a
# draft GitHub release of this repository. The steps follow upstream's electron-release.yml
# (Publish Realeco) for its Windows leg; the release and update metadata point at this fork, and the
# app id / product name differ from upstream so the installer never replaces an official Folia install.
name: Folia-LX Windows installer

# Windows runners cost 2x Actions minutes on a private repo, so this only runs when started by hand
# (Actions → Folia-LX Windows installer → Run workflow) or on a tag ending in -win (e.g. v0.2.17-win).
on:
  push:
    tags:
      - 'v*-win'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folia-lx-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm ci 2>&1 | tee ci-logs/01-npm-ci.log

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache wallpaper-helper Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/wallpaper-helper

      - name: Build wallpaper helper
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          node packaging/windows/build-wallpaper-helper.mjs 2>&1 | tee ci-logs/02-wallpaper-helper.log

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION%-win}"
          node -e "const fs=require('fs'); const pkg=require('./package.json'); pkg.version=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');" "$VERSION"

      - name: Build web app for Electron
        env:
          ELECTRON: 'true'
          APP_VERSION_LABEL: Folia-LX
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm run build 2>&1 | tee ci-logs/03-build.log

      - name: Package Electron app
        # pwsh (the runner default) so fetch-ffmpeg's `tar` resolves to Windows bsdtar, not Git Bash tar.
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          npx electron-builder --win nsis --publish never `
            --config.appId=top.izuna.foliamajor.lx `
            "--config.productName=Folia LX" `
            --config.publish.provider=github `
            "--config.publish.owner=${{ github.repository_owner }}" `
            "--config.publish.repo=${{ github.event.repository.name }}" 2>&1 | Tee-Object -FilePath ci-logs/04-electron-builder.log
          exit $LASTEXITCODE

      - name: Upload installer
        # The artifact storage quota can run out on a private repo; the release below is what matters.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: folia-lx-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml
          if-no-files-found: error
          retention-days: 14

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          # v0.2.17-win attaches to the same release as the Android build (v0.2.17).
          TAG="${REF%-win}"
          shopt -s nullglob
          files=(release/*.exe release/*.blockmap release/latest*.yml)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Folia-LX $TAG" --draft \
              --notes "Folia-LX $TAG（Windows 安装包）。不含任何音源脚本，仅供个人学习研究。"
          fi

      - name: Push failure logs to ci-logs branch
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/logs && cp -r ci-logs/. /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "folia-lx-ci"
          git config user.email "ci@users.noreply.github.com"
          echo "run ${{ github.run_id }}" > RUN.txt
          git add -A && git commit -qm "logs for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
